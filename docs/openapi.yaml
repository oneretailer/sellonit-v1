        reason: {type: string, maxLength: 500}

    UpdateBulkSupplyRequest:
      type: object
      properties:
        status: {$ref: '#/components/schemas/BulkSupplyStatus'}
        receivedItems:
          type: array
          items:
            $ref: '#/components/schemas/BulkSupplyItem'

