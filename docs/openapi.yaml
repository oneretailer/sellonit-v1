openapi: 3.1.0
info:
  title: Sellonit API
  version: 1.0.3
  description: |
    Canonical API contract for Sellonit.

    Sellonit is a virtual-inventory commerce and supply-chain platform connecting
    suppliers/manufacturers, independent online retailers, and customers.

    Core model:
      Supplier/Manufacturer -> Sellonit -> Retailer Store -> Customer

    The API separates:
      - identity and business membership
      - supplier catalogue and physical inventory
      - retailer store listings
      - customer carts and orders
      - payments, escrow and settlements
      - fulfillment
      - demand aggregation
      - bulk supply requests
      - shipments and 3PL orchestration

    Finalized MVP scope v1.0.3 (pre-release contract correction):
      PAYMENT -> ESCROW -> FULFILLMENT -> SHIPMENT -> SETTLEMENT -> ORDER COMPLETED.
      Order COMPLETED is a final commercial state requiring a non-empty, complete
      set of associated settlements, ALL SETTLED, and their escrow RELEASED.
      Delivered shipments, completed fulfillment or held escrow alone never complete an order.
      Central discovery is directory-only; checkout always belongs to one retailer
      or enterprise store. Enterprise extends supplier capabilities with a B2C store.
      Customer is an identity, not a business membership type.

    Contract rules:
      - SupplierProduct is the master physical product record.
      - RetailerProductListing references SupplierProduct and is store-specific.
      - Supplier inventory is the physical stock source of truth.
      - Order, Fulfillment and Shipment are separate resources.
      - A single customer order may create multiple fulfillments and shipments.
      - API clients must never trust client-supplied prices or payment success.
      - All write operations that can be retried support idempotency where stated.
      - All tenant-owned resources are authorization-scoped to the authenticated
        user's business/store membership.

servers:
  - url: https://api.sellonit.app/v1
    description: Production
  - url: https://staging-api.sellonit.app/v1
    description: Staging
  - url: http://localhost:4000/v1
    description: Local development

tags:
  - name: Auth
  - name: Businesses
  - name: Stores
  - name: Supplier Profiles
  - name: Supplier Products
  - name: Retailer Profiles
  - name: Retailer Listings
  - name: Catalogue
  - name: Customers
  - name: Carts
  - name: Orders
  - name: Payments
  - name: Inventory
  - name: Fulfillment
  - name: Demand Aggregation
  - name: Bulk Supply Requests
  - name: Shipments
  - name: 3PL
  - name: Notifications
  - name: Analytics
  - name: Health

security:
  - bearerAuth: []

paths:

  /health:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: API is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      security: []
      responses:
        '200':
          description: API dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUser'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUser'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      responses:
        '204':
          description: Logged out

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Reset request accepted

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset

  /me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUser'

  /businesses:
    get:
      tags: [Businesses]
      summary: List businesses accessible to current user
      responses:
        '200':
          description: Businesses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusinesses'
    post:
      tags: [Businesses]
      summary: Create a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessRequest'
      responses:
        '201':
          description: Business created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBusiness'
        '400':
          $ref: '#/components/responses/ValidationError'

  /businesses/{businessId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Businesses]
      summary: Get business
      responses:
        '200':
          description: Business
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBusiness'
    patch:
      tags: [Businesses]
      summary: Update business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessRequest'
      responses:
        '200':
          description: Updated business
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBusiness'

  /businesses/{businessId}/members:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Businesses]
      summary: List business members
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMembers'
    post:
      tags: [Businesses]
      summary: Add a business member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMember'

  /businesses/{businessId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - $ref: '#/components/parameters/MemberId'
    patch:
      tags: [Businesses]
      summary: Change member role/status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMember'
    delete:
      tags: [Businesses]
      summary: Remove member
      responses:
        '204':
          description: Removed

  /businesses/{businessId}/supplier-profile:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Supplier Profiles]
      summary: Get supplier profile
      responses:
        '200':
          description: Supplier profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupplierProfile'
    put:
      tags: [Supplier Profiles]
      summary: Create or replace supplier profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertSupplierProfileRequest'
      responses:
        '200':
          description: Supplier profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupplierProfile'

  /businesses/{businessId}/retailer-profile:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Retailer Profiles]
      summary: Get retailer profile
      responses:
        '200':
          description: Retailer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRetailerProfile'
    put:
      tags: [Retailer Profiles]
      summary: Create or replace retailer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertRetailerProfileRequest'
      responses:
        '200':
          description: Retailer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRetailerProfile'

  /businesses/{businessId}/stores:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Stores]
      summary: List stores owned by a business
      responses:
        '200':
          description: Stores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStores'
    post:
      tags: [Stores]
      summary: Create a store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreRequest'
      responses:
        '201':
          description: Store created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStore'

  /stores/{storeId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [Stores]
      summary: Get store
      responses:
        '200':
          description: Store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStore'
    patch:
      tags: [Stores]
      summary: Update store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreRequest'
      responses:
        '200':
          description: Updated store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStore'

  /stores/{storeId}/publish:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    post:
      tags: [Stores]
      summary: Publish storefront
      responses:
        '200':
          description: Published store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStore'

  /stores/{storeId}/unpublish:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    post:
      tags: [Stores]
      summary: Unpublish storefront
      responses:
        '200':
          description: Unpublished store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStore'

  /supplier-products:
    get:
      tags: [Supplier Products]
      summary: List supplier products owned by current business
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ProductStatus'}
        - $ref: '#/components/parameters/BusinessQuery'
      responses:
        '200':
          description: Supplier products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSupplierProducts'
    post:
      tags: [Supplier Products]
      summary: Create master supplier product
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplierProductRequest'
      responses:
        '201':
          description: Supplier product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupplierProduct'
        '409':
          $ref: '#/components/responses/Conflict'

  /supplier-products/{supplierProductId}:
    parameters:
      - $ref: '#/components/parameters/SupplierProductId'
    get:
      tags: [Supplier Products]
      summary: Get supplier product
      responses:
        '200':
          description: Supplier product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupplierProduct'
    patch:
      tags: [Supplier Products]
      summary: Update supplier product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupplierProductRequest'
      responses:
        '200':
          description: Updated supplier product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupplierProduct'

  /supplier-products/{supplierProductId}/publish:
    parameters:
      - $ref: '#/components/parameters/SupplierProductId'
    post:
      tags: [Supplier Products]
      summary: Publish supplier product to retailer catalogue
      responses:
        '200':
          description: Published product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupplierProduct'

  /supplier-products/{supplierProductId}/unpublish:
    parameters:
      - $ref: '#/components/parameters/SupplierProductId'
    post:
      tags: [Supplier Products]
      summary: Remove supplier product from retailer catalogue
      responses:
        '200':
          description: Unpublished product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupplierProduct'

  /supplier-products/{supplierProductId}/inventory:
    parameters:
      - $ref: '#/components/parameters/SupplierProductId'
    get:
      tags: [Inventory]
      summary: Get current inventory
      responses:
        '200':
          description: Inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInventory'
    post:
      tags: [Inventory]
      summary: Adjust inventory
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAdjustmentRequest'
      responses:
        '200':
          description: Updated inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInventory'
        '409':
          description: Inventory conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /supplier-products/{supplierProductId}/pricing-rule:
    parameters:
      - $ref: '#/components/parameters/SupplierProductId'
    put:
      tags: [Supplier Products]
      summary: Set supplier pricing rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPricingRuleRequest'
      responses:
        '200':
          description: Pricing rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePricingRule'

  /catalogue/products:
    get:
      tags: [Catalogue]
      summary: Browse published supplier catalogue as a retailer
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/SupplierId'
        - $ref: '#/components/parameters/InStock'
      responses:
        '200':
          description: Published supplier catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogueProducts'

  /catalogue/products/{supplierProductId}:
    parameters:
      - $ref: '#/components/parameters/SupplierProductId'
    get:
      tags: [Catalogue]
      summary: Get supplier product from retailer catalogue
      responses:
        '200':
          description: Catalogue product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCatalogueProduct'

  /stores/{storeId}/listings:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [Retailer Listings]
      summary: List retailer product listings
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ListingStatus'}
      responses:
        '200':
          description: Retailer listings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRetailerListings'
    post:
      tags: [Retailer Listings]
      summary: Add supplier product to retailer store
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRetailerListingRequest'
      responses:
        '201':
          description: Retailer listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRetailerListing'
        '409':
          $ref: '#/components/responses/Conflict'

  /stores/{storeId}/listings/{listingId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/ListingId'
    get:
      tags: [Retailer Listings]
      summary: Get retailer listing
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRetailerListing'
    patch:
      tags: [Retailer Listings]
      summary: Update retailer listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRetailerListingRequest'
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRetailerListing'
    delete:
      tags: [Retailer Listings]
      summary: Remove product from retailer store
      responses:
        '204':
          description: Listing removed

  /stores/{storeId}/listings/{listingId}/publish:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/ListingId'
    post:
      tags: [Retailer Listings]
      summary: Publish retailer listing
      responses:
        '200':
          description: Published listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRetailerListing'

  /stores/{storeId}/listings/{listingId}/unpublish:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/ListingId'
    post:
      tags: [Retailer Listings]
      summary: Unpublish retailer listing
      responses:
        '200':
          description: Unpublished listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRetailerListing'

  /public/stores/{storeSlug}:
    parameters:
      - $ref: '#/components/parameters/StoreSlug'
    get:
      tags: [Stores]
      summary: Get public storefront
      security: []
      responses:
        '200':
          description: Public store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePublicStore'

  /public/stores/{storeSlug}/products:
    parameters:
      - $ref: '#/components/parameters/StoreSlug'
    get:
      tags: [Stores]
      summary: List public store products
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Public products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicProducts'

  /public/stores/{storeSlug}/products/{listingId}:
    parameters:
      - $ref: '#/components/parameters/StoreSlug'
      - $ref: '#/components/parameters/ListingId'
    get:
      tags: [Stores]
      summary: Get public store product
      security: []
      responses:
        '200':
          description: Public product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePublicProduct'

  /stores/{storeId}/customers:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [Customers]
      summary: List store customers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomers'

  /stores/{storeId}/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Customers]
      summary: Get customer
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCustomer'

  /carts:
    post:
      tags: [Carts]
      summary: Create a cart
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCartRequest'
      responses:
        '201':
          description: Cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCart'

  /carts/{cartId}:
    parameters:
      - $ref: '#/components/parameters/CartId'
    get:
      tags: [Carts]
      summary: Get cart
      security: []
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCart'
    patch:
      tags: [Carts]
      summary: Update cart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartRequest'
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCart'

  /carts/{cartId}/items:
    parameters:
      - $ref: '#/components/parameters/CartId'
    post:
      tags: [Carts]
      summary: Add item to cart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
