        method: {$ref: '#/components/schemas/PaymentMethod'}

    PaymentWebhookEvent:
      description: Internal normalized event after provider verification; not the native webhook wire payload.
      type: object
      required: [event, reference, status, amount]
      properties:
        event: {type: string}
        reference: {type: string}
        status: {$ref: '#/components/schemas/PaymentState'}
        amount: {$ref: '#/components/schemas/Money'}
