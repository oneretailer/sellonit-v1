        '204':
          description: Removed

  /checkout:
    post:
      tags: [Orders]
      summary: Validate a single store cart and create a NEW order
      description: No central unified checkout. Revalidate authoritative prices and stock; inventory is reserved atomically only on trusted payment confirmation.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Pending order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrder'
        '409':
          description: Stock or price changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders:
    get:
      tags: [Orders]
      summary: List orders accessible to current user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/OrderState'}
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrders'

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      summary: Get order
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrder'
    post:
      tags: [Orders]
      summary: Reserved for explicit order actions; use checkout for customer creation
      deprecated: true
      responses:
        '405':
          description: Method not supported

  /orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      summary: Cancel order when cancellation policy allows
      description: NEW or PAID only, before fulfillment leaves PENDING_BATCH. Refund held escrow and undo reservations idempotently through backend orchestration; reject later cancellation with 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrder'
        '409':
          $ref: '#/components/responses/Conflict'

  /payments/initialize:
    post:
      tags: [Payments]
      summary: Initialize customer payment
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializePaymentRequest'
      responses:
        '201':
          description: Payment initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePaymentInitialization'

  /payments/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    get:
      tags: [Payments]
      summary: Get payment status
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePayment'

  /webhooks/payments:
    post:
      tags: [Payments]
      summary: Receive payment provider webhook
      description: |
        Provider-specific raw JSON, verified by the configured provider adapter against
        the unmodified request body before normalization. No browser confirmation.
        Require the selected adapter's signature header; absence or invalid signature
        is 401. Verify reference, amount, NGN currency and order association server-side.
        Deduplicate provider + event/reference durably; valid duplicate deliveries return
        200 without repeating reservation, escrow, settlement, fulfillment or notifications.
        Confirmation and inventory reservation must commit atomically. Insufficient stock
        records a reconciliation conflict without marking the order PAID.
        Never acknowledge unpersisted financial work as successfully processed.
      security: []
      parameters:
        - $ref: '#/components/parameters/PaymentSignature'
        - $ref: '#/components/parameters/FlutterwaveSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Native provider payload; adapter validates before normalization.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'

  /fulfillments:
    get:
      tags: [Fulfillment]
      summary: List fulfillments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/FulfillmentState'}
        - $ref: '#/components/parameters/SupplierBusinessId'
      responses:
        '200':
          description: Fulfillments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFulfillments'

  /fulfillments/{fulfillmentId}:
    parameters:
      - $ref: '#/components/parameters/FulfillmentId'
    get:
      tags: [Fulfillment]
      summary: Get fulfillment
      responses:
        '200':
          description: Fulfillment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseFulfillment'
    patch:
      tags: [Fulfillment]
      summary: Update fulfillment operational state
      description: Authorized operations staff only, scoped to owning business. Enforce PENDING_BATCH -> IN_BULK_REQUEST -> AT_3PL_HUB -> COMPLETED; never complete the order from this update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFulfillmentRequest'
      responses:
        '200':
          description: Fulfillment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseFulfillment'

  /demand-batches:
    get:
      tags: [Demand Aggregation]
      summary: List demand batches
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/DemandBatchStatus'}
        - $ref: '#/components/parameters/SupplierBusinessId'
      responses:
        '200':
          description: Demand batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDemandBatches'

  /demand-batches/{batchId}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Demand Aggregation]
      summary: Get demand batch
      responses:
        '200':
          description: Demand batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDemandBatch'
    post:
      tags: [Demand Aggregation]
      summary: Manually close/release a batch when authorized
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseBatchRequest'
      responses:
        '200':
          description: Released batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDemandBatch'

  /bulk-supply-requests:
    get:
      tags: [Bulk Supply Requests]
      summary: List bulk supply requests
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/BulkSupplyStatus'}
        - $ref: '#/components/parameters/SupplierBusinessId'
      responses:
        '200':
          description: Bulk supply requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBulkSupplyRequests'

  /bulk-supply-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/BulkRequestId'
    get:
      tags: [Bulk Supply Requests]
      summary: Get bulk supply request
      responses:
        '200':
          description: Bulk request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBulkSupplyRequest'
    patch:
      tags: [Bulk Supply Requests]
      summary: Update supplier response / operational status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBulkSupplyRequest'
      responses:
        '200':
          description: Bulk request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBulkSupplyRequest'

  /shipments:
    get:
      tags: [Shipments]
      summary: List shipments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ShipmentState'}
        - $ref: '#/components/parameters/OrderIdQuery'
      responses:
        '200':
          description: Shipments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedShipments'

  /shipments/{shipmentId}:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    get:
      tags: [Shipments]
      summary: Get shipment
      responses:
        '200':
          description: Shipment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseShipment'

  /shipments/{shipmentId}/events:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    get:
      tags: [Shipments]
      summary: List shipment events
      responses:
        '200':
          description: Shipment events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseShipmentEvents'

  /webhooks/3pl:
    post:
      tags: [3PL]
      summary: Receive 3PL shipment/status webhook
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreePLWebhookEvent'
      responses:
        '200':
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'

  /notifications:
    get:
      tags: [Notifications]
      summary: List current user's notifications
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/UnreadOnly'
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotifications'

  /notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Notifications]
      summary: Mark notification as read
      responses:
        '204':
          description: Marked read

  /analytics/stores/{storeId}/overview:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [Analytics]
      summary: Store overview analytics
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Store analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStoreAnalytics'

  /analytics/suppliers/{businessId}/overview:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
    get:
      tags: [Analytics]
      summary: Supplier overview analytics
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Supplier analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupplierAnalytics'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token. Refresh handled through /auth/refresh.

  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MemberId:
      name: memberId
      in: path
      required: true
      schema: {type: string, format: uuid}
    StoreId:
      name: storeId
      in: path
      required: true
      schema: {type: string, format: uuid}
    StoreSlug:
      name: storeSlug
      in: path
      required: true
      schema: {type: string, minLength: 2, maxLength: 80, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
    SupplierProductId:
      name: supplierProductId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ListingId:
      name: listingId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CartId:
      name: cartId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CartItemId:
      name: itemId
      in: path
      required: true
      schema: {type: string, format: uuid}
    OrderId:
      name: orderId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    FulfillmentId:
      name: fulfillmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    BatchId:
      name: batchId
      in: path
      required: true
      schema: {type: string, format: uuid}
    BulkRequestId:
      name: requestId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Search:
      name: search
      in: query
      schema: {type: string, maxLength: 200}
    BusinessQuery:
      name: businessId
      in: query
      schema: {type: string, format: uuid}
    StoreIdQuery:
      name: storeId
      in: query
      schema: {type: string, format: uuid}
    SupplierBusinessId:
      name: supplierBusinessId
      in: query
      schema: {type: string, format: uuid}
    CategoryId:
      name: categoryId
      in: query
      schema: {type: string, format: uuid}
    SupplierId:
      name: supplierId
      in: query
      schema: {type: string, format: uuid}
    InStock:
      name: inStock
      in: query
      schema: {type: boolean}
    DateFrom:
      name: dateFrom
      in: query
      schema: {type: string, format: date-time}
    DateTo:
      name: dateTo
      in: query
      schema: {type: string, format: date-time}
    OrderIdQuery:
      name: orderId
      in: query
      schema: {type: string, format: uuid}
    UnreadOnly:
      name: unreadOnly
      in: query
      schema: {type: boolean, default: false}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for safe retry of a mutating request. Reuse the same key only for the same logical operation.
      schema: {type: string, minLength: 16, maxLength: 128}
    PaymentSignature:
      name: x-paystack-signature
      in: header
      description: Required for Paystack; adapter verifies HMAC-SHA512 over raw bytes.
      schema: {type: string}
    FlutterwaveSignature:
      name: flutterwave-signature
      in: header
      description: Required for the configured Flutterwave HMAC-SHA256 webhook integration; adapter verifies raw bytes using its secret. Legacy verif-hash integrations require a separately configured adapter, never automatic fallback.
      schema: {type: string}
    WebhookSignature:
      name: X-Webhook-Signature
      in: header
      required: true
      schema: {type: string}

  schemas:

    UserRole:
      type: string
      enum: [OWNER, ADMIN, STAFF, SUPPLIER, RETAILER]
    BusinessType:
      type: string
      enum: [SUPPLIER, ENTERPRISE, RETAILER]
    UserStatus:
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED]
    StoreStatus:
      type: string
      enum: [DRAFT, PUBLISHED, UNPUBLISHED, SUSPENDED]
    ProductStatus:
      type: string
      enum: [DRAFT, PUBLISHED, UNPUBLISHED, ARCHIVED]
    ListingStatus:
      type: string
      enum: [DRAFT, PUBLISHED, UNPUBLISHED, ARCHIVED]
    PricingRuleType:
      type: string
      enum: [FLEXIBLE, FIXED_MSRP, MAP]
    OrderStatus:
      $ref: '#/components/schemas/OrderState'
    OrderState:
      type: string
      enum: [NEW, PAID, COMPLETED, CANCELLED]
    PaymentStatus:
      $ref: '#/components/schemas/PaymentState'
    PaymentState:
      type: string
      enum: [PENDING, CONFIRMED, FAILED]
    FulfillmentStatus:
      $ref: '#/components/schemas/FulfillmentState'
    FulfillmentState:
      type: string
      enum: [PENDING_BATCH, IN_BULK_REQUEST, AT_3PL_HUB, COMPLETED]
    ShipmentStatus:
      $ref: '#/components/schemas/ShipmentState'
    ShipmentState:
      type: string
      enum: [PENDING, IN_TRANSIT, DELIVERED, FAILED]
    DemandBatchStatus:
      type: string
      enum: [OPEN, THRESHOLD_REACHED, TIME_EXPIRED, LOCKED, RELEASED, COMPLETED, CANCELLED]
    BulkSupplyStatus:
      type: string
      enum: [DRAFT, SENT, ACKNOWLEDGED, PREPARING, IN_TRANSIT, RECEIVED, PARTIALLY_RECEIVED, COMPLETED, CANCELLED]
    EscrowState:
      type: string
      enum: [HELD, RELEASED, REFUNDED]
    SettlementState:
      type: string
      enum: [LOCKED, PENDING, SETTLED]
    PaymentMethod:
      type: string
      enum: [BANK_TRANSFER, USSD]
    Currency:
      type: string
      enum: [NGN]
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          description: Minor units (kobo for NGN).
          example: 520000
        currency:
          $ref: '#/components/schemas/Currency'
    Address:
      type: object
      required: [recipientName, phone, addressLine1, city, state, country]
      properties:
        recipientName: {type: string, minLength: 2, maxLength: 120}
        phone: {type: string, minLength: 7, maxLength: 30}
        addressLine1: {type: string, minLength: 3, maxLength: 250}
        addressLine2: {type: string, maxLength: 250}
        area: {type: string, maxLength: 120}
        city: {type: string, maxLength: 120}
        state: {type: string, maxLength: 120}
        country: {type: string, minLength: 2, maxLength: 2, default: NG}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}

    User:
      type: object
      required: [id, email, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        firstName: {type: string, maxLength: 80}
        lastName: {type: string, maxLength: 80}
        phone: {type: string, maxLength: 30}
        status: {$ref: '#/components/schemas/UserStatus'}
        emailVerifiedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    Business:
      type: object
      required: [id, name, type, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 2, maxLength: 160}
        type: {$ref: '#/components/schemas/BusinessType'}
        slug: {type: string, maxLength: 100}
        phone: {type: string, maxLength: 30}
        email: {type: string, format: email}
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DEACTIVATED]
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    Member:
      type: object
      required: [id, userId, businessId, role, status]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        businessId: {type: string, format: uuid}
        role: {$ref: '#/components/schemas/UserRole'}
        status:
          type: string
          enum: [INVITED, ACTIVE, SUSPENDED, REMOVED]
        createdAt: {type: string, format: date-time}

    Store:
      type: object
      required: [id, businessId, name, slug, status]
      properties:
        id: {type: string, format: uuid}
        businessId: {type: string, format: uuid}
        name: {type: string, minLength: 2, maxLength: 160}
        slug: {type: string, minLength: 2, maxLength: 80}
        description: {type: string, maxLength: 2000}
        logoUrl: {type: string, format: uri}
        status: {$ref: '#/components/schemas/StoreStatus'}
        publishedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    SupplierProfile:
      type: object
      required: [businessId]
      properties:
        businessId: {type: string, format: uuid}
        legalName: {type: string, maxLength: 200}
        description: {type: string, maxLength: 3000}
        contactPhone: {type: string, maxLength: 30}
        originLocation:
          $ref: '#/components/schemas/Address'
        retailerAccess:
          type: string
          enum: [OPEN, APPROVAL_REQUIRED, PRIVATE]

    RetailerProfile:
      type: object
      required: [businessId]
      properties:
        businessId: {type: string, format: uuid}
        description: {type: string, maxLength: 3000}
        contactPhone: {type: string, maxLength: 30}

    SupplierProduct:
      type: object
      required: [id, businessId, sku, name, basePrice, inventoryCount, status]
      properties:
        id: {type: string, format: uuid}
        businessId: {type: string, format: uuid}
        sku: {type: string, minLength: 1, maxLength: 100}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
        categoryId: {type: [string, 'null'], format: uuid}
        basePrice: {$ref: '#/components/schemas/Money'}
        inventoryCount: {type: integer, minimum: 0}
        reservedCount: {type: integer, minimum: 0}
        availableCount: {type: integer, minimum: 0}
        originLocation: {$ref: '#/components/schemas/Address'}
        status: {$ref: '#/components/schemas/ProductStatus'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    PricingRule:
      type: object
      required: [type]
      properties:
        type: {$ref: '#/components/schemas/PricingRuleType'}
        fixedRetailPrice: {$ref: '#/components/schemas/Money'}
        minimumRetailPrice: {$ref: '#/components/schemas/Money'}
        effectiveFrom: {type: string, format: date-time}
        effectiveTo: {type: [string, 'null'], format: date-time}

    RetailerProductListing:
      type: object
      required: [id, storeId, supplierProductId, sellingPrice, status]
      properties:
        id: {type: string, format: uuid}
        storeId: {type: string, format: uuid}
        supplierProductId: {type: string, format: uuid}
        displayTitle: {type: string, maxLength: 200}
        displayDescription: {type: string, maxLength: 5000}
        sellingPrice: {$ref: '#/components/schemas/Money'}
        margin: {$ref: '#/components/schemas/Money'}
        availableCount: {type: integer, minimum: 0}
        status: {$ref: '#/components/schemas/ListingStatus'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    CatalogueProduct:
      allOf:
        - $ref: '#/components/schemas/SupplierProduct'
        - type: object
          properties:
            supplier:
              $ref: '#/components/schemas/Business'
            pricingRule:
              $ref: '#/components/schemas/PricingRule'

    PublicProduct:
      type: object
      required: [listingId, name, sellingPrice, availableCount]
      properties:
        listingId: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        sellingPrice: {$ref: '#/components/schemas/Money'}
        availableCount: {type: integer, minimum: 0}
        images:
          type: array
          items: {type: string, format: uri}

    Customer:
      type: object
      required: [id, storeId]
      properties:
        id: {type: string, format: uuid}
        storeId: {type: string, format: uuid}
        name: {type: string, maxLength: 160}
        email: {type: string, format: email}
        phone: {type: string, maxLength: 30}
        defaultAddress: {$ref: '#/components/schemas/Address'}
        createdAt: {type: string, format: date-time}

    CartItem:
      type: object
      required: [id, listingId, quantity, unitPrice, subtotal]
      properties:
        id: {type: string, format: uuid}
        listingId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1}
        unitPrice: {$ref: '#/components/schemas/Money'}
        subtotal: {$ref: '#/components/schemas/Money'}

    Cart:
      type: object
      required: [id, storeId, items, subtotal]
      properties:
        id: {type: string, format: uuid}
        storeId: {type: string, format: uuid}
        customerId: {type: [string, 'null'], format: uuid}
        items:
          type: array
          items: {$ref: '#/components/schemas/CartItem'}
        subtotal: {$ref: '#/components/schemas/Money'}
        expiresAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    OrderItem:
      type: object
      required: [id, listingId, supplierProductId, quantity, unitPrice, subtotal]
      properties:
        id: {type: string, format: uuid}
        listingId: {type: string, format: uuid}
        supplierProductId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1}
        unitPrice: {$ref: '#/components/schemas/Money'}
        supplierBasePriceAtPurchase: {$ref: '#/components/schemas/Money'}
        retailerMarginAtPurchase: {$ref: '#/components/schemas/Money'}
        subtotal: {$ref: '#/components/schemas/Money'}

    Order:
      description: NEW becomes PAID only on verified provider confirmation. PAID becomes COMPLETED only after ALL required settlements are SETTLED and escrow RELEASED. Financial arrays must be complete, not a filtered or paginated subset.
      type: object
      required: [id, storeId, status, items, subtotal, total, createdAt]
      properties:
        id: {type: string, format: uuid}
        orderNumber: {type: string}
        storeId: {type: string, format: uuid}
        customerId: {type: [string, 'null'], format: uuid}
        status: {$ref: '#/components/schemas/OrderStatus'}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
        shippingAddress: {$ref: '#/components/schemas/Address'}
        subtotal: {$ref: '#/components/schemas/Money'}
        deliveryFee: {$ref: '#/components/schemas/Money'}
        total: {$ref: '#/components/schemas/Money'}
        paymentId: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
        paidAt: {type: [string, 'null'], format: date-time}
        escrows:
          type: array
          readOnly: true
          items: {$ref: '#/components/schemas/Escrow'}
        settlements:
          type: array
          readOnly: true
          items: {$ref: '#/components/schemas/Settlement'}

    Escrow:
      description: Backend-owned funds for a settlement. Created HELD on payment confirmation; RELEASED only after that settlement is SETTLED; REFUNDED on permitted pre-fulfillment cancellation. Never client-writable.
      type: object
      required: [id, orderId, paymentId, settlementId, status, amount]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        paymentId: {type: string, format: uuid}
        settlementId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/EscrowState'}
        amount: {$ref: '#/components/schemas/Money'}

    Settlement:
      description: Backend-owned reconciliation per fulfillment. LOCKED while escrow is HELD, then PENDING only when its non-empty complete shipment set is DELIVERED. SETTLED requires trusted financial reconciliation, never customer input. One order may require multiple settlements.
      type: object
      required: [id, orderId, fulfillmentId, supplierBusinessId, escrowId, shipmentIds, status, amount]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        fulfillmentId: {type: string, format: uuid}
        supplierBusinessId: {type: string, format: uuid}
        escrowId: {type: string, format: uuid}
        shipmentIds:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/SettlementState'}
        amount: {$ref: '#/components/schemas/Money'}

    Payment:
      type: object
      required: [id, orderId, status, amount]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        method: {$ref: '#/components/schemas/PaymentMethod'}
        provider: {type: string, description: Adapter identifier; MVP providers may include paystack and flutterwave., example: paystack}
        providerReference: {type: string}
        status: {$ref: '#/components/schemas/PaymentStatus'}
        amount: {$ref: '#/components/schemas/Money'}
        paidAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}

    Inventory:
      description: Shared physical stock keyed by SupplierProduct, never by retailer listing. availableCount = inventoryCount - reservedCount. Verified payment atomically reserves all order lines (conditional update or row locks); insufficient stock rolls back the entire allocation with INSUFFICIENT_INVENTORY. Unique payment/order allocation keys prevent retries reserving twice. Fulfillment allocatedQuantity draws from this reservation, never a second stock pool.
      type: object
      required: [supplierProductId, inventoryCount, reservedCount, availableCount]
      properties:
        supplierProductId: {type: string, format: uuid}
        inventoryCount: {type: integer, minimum: 0}
        reservedCount: {type: integer, minimum: 0}
        availableCount: {type: integer, minimum: 0}
        version: {type: integer, minimum: 0}
        updatedAt: {type: string, format: date-time}

    Fulfillment:
      type: object
      required: [id, orderId, supplierBusinessId, status]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        supplierBusinessId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/FulfillmentStatus'}
        items:
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentItem'
        batchId: {type: [string, 'null'], format: uuid}
        bulkSupplyRequestId: {type: [string, 'null'], format: uuid}
        shipmentIds:
          type: array
          items: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    FulfillmentItem:
      type: object
      required: [id, orderItemId, supplierProductId, quantity]
      properties:
        id: {type: string, format: uuid}
        orderItemId: {type: string, format: uuid}
        supplierProductId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1}
        allocatedQuantity: {type: integer, minimum: 0}

    DemandBatch:
      description: Demand grouped by SupplierProduct; release every 2–3 days or early when total pending supplier demand reaches 50 units. Supplier prepares individually pre-labeled customer packages for external 3PL cross-dock.
      type: object
      required: [id, supplierBusinessId, supplierProductId, status, totalUnits]
      properties:
        id: {type: string, format: uuid}
        supplierBusinessId: {type: string, format: uuid}
        supplierProductId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/DemandBatchStatus'}
        totalUnits: {type: integer, minimum: 0}
        thresholdUnits: {type: integer, minimum: 1, default: 50}
        openedAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
        releasedAt: {type: [string, 'null'], format: date-time}
        bulkSupplyRequestId: {type: [string, 'null'], format: uuid}

    BulkSupplyRequest:
      type: object
      required: [id, supplierBusinessId, status, items]
      properties:
        id: {type: string, format: uuid}
        supplierBusinessId: {type: string, format: uuid}
        demandBatchId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/BulkSupplyStatus'}
        destinationHubId: {type: string, format: uuid}
        items:
          type: array
          items:
            $ref: '#/components/schemas/BulkSupplyItem'
        requestedAt: {type: string, format: date-time}
        acknowledgedAt: {type: [string, 'null'], format: date-time}
        receivedAt: {type: [string, 'null'], format: date-time}

    BulkSupplyItem:
      type: object
      required: [supplierProductId, requestedQuantity]
      properties:
        supplierProductId: {type: string, format: uuid}
        requestedQuantity: {type: integer, minimum: 1}
        receivedQuantity: {type: integer, minimum: 0}

    Shipment:
      type: object
      description: Pre-labeled customer package via external 3PL cross-dock and last-mile carrier. FAILED packages return to supplier; no in-hub holding.
      required: [id, orderId, fulfillmentId, status, destination]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        fulfillmentId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ShipmentStatus'}
        trackingNumber: {type: [string, 'null']}
        provider: {type: [string, 'null']}
        providerShipmentId: {type: [string, 'null']}
        destination: {$ref: '#/components/schemas/Address'}
        hubId: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    ShipmentEvent:
      type: object
      required: [id, shipmentId, status, occurredAt]
      properties:
        id: {type: string, format: uuid}
        shipmentId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ShipmentStatus'}
        location: {type: [string, 'null']}
        note: {type: [string, 'null']}
        occurredAt: {type: string, format: date-time}

    Notification:
      type: object
      required: [id, type, title, readAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        title: {type: string}
        body: {type: string}
        readAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 128}
        firstName: {type: string, minLength: 1, maxLength: 80}
        lastName: {type: string, minLength: 1, maxLength: 80}
        phone: {type: string, maxLength: 30}

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, minLength: 10}

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string}

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: {type: string}
        password: {type: string, minLength: 8, maxLength: 128}

    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: {type: string}
        expiresIn: {type: integer, minimum: 1}
        tokenType: {type: string, enum: [Bearer]}

    AuthResponse:
      type: object
      required: [user, accessToken, expiresIn]
      properties:
        user: {$ref: '#/components/schemas/User'}
        accessToken: {type: string}
        refreshToken: {type: string}
        expiresIn: {type: integer}

    CreateBusinessRequest:
      type: object
      required: [name, type]
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        type: {$ref: '#/components/schemas/BusinessType'}
        slug: {type: string, maxLength: 100}
        phone: {type: string, maxLength: 30}
        email: {type: string, format: email}

    UpdateBusinessRequest:
      type: object
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        phone: {type: string, maxLength: 30}
        email: {type: string, format: email}

    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/UserRole'}

    UpdateMemberRequest:
      type: object
      properties:
        role: {$ref: '#/components/schemas/UserRole'}
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, REMOVED]

    UpsertSupplierProfileRequest:
      type: object
      properties:
        legalName: {type: string, maxLength: 200}
        description: {type: string, maxLength: 3000}
        contactPhone: {type: string, maxLength: 30}
        originLocation: {$ref: '#/components/schemas/Address'}
        retailerAccess:
          type: string
          enum: [OPEN, APPROVAL_REQUIRED, PRIVATE]

    UpsertRetailerProfileRequest:
      type: object
      properties:
        description: {type: string, maxLength: 3000}
        contactPhone: {type: string, maxLength: 30}

    CreateStoreRequest:
      type: object
      required: [name, slug]
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        slug: {type: string, minLength: 2, maxLength: 80, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        description: {type: string, maxLength: 2000}

    UpdateStoreRequest:
      type: object
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        description: {type: string, maxLength: 2000}
        logoUrl: {type: string, format: uri}

    CreateSupplierProductRequest:
      type: object
      required: [businessId, sku, name, basePrice]
      properties:
        businessId: {type: string, format: uuid}
        sku: {type: string, minLength: 1, maxLength: 100}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
        categoryId: {type: string, format: uuid}
        basePrice: {$ref: '#/components/schemas/Money'}
        inventoryCount: {type: integer, minimum: 0, default: 0}
        originLocation: {$ref: '#/components/schemas/Address'}

    UpdateSupplierProductRequest:
      type: object
      properties:
        name: {type: string, maxLength: 200}
        description: {type: string, maxLength: 5000}
        categoryId: {type: [string, 'null'], format: uuid}
        basePrice: {$ref: '#/components/schemas/Money'}
        originLocation: {$ref: '#/components/schemas/Address'}

    InventoryAdjustmentRequest:
      type: object
      required: [delta, reason]
      properties:
        delta:
          type: integer
          description: Positive adds stock; negative removes stock.
        reason:
          type: string
          enum: [INITIAL_STOCK, RESTOCK, CORRECTION, DAMAGE, LOSS, RETURNED_STOCK, MANUAL_ADJUSTMENT]
        note: {type: string, maxLength: 500}

    UpsertPricingRuleRequest:
      type: object
      required: [type]
      properties:
        type: {$ref: '#/components/schemas/PricingRuleType'}
        fixedRetailPrice: {$ref: '#/components/schemas/Money'}
