name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate OpenAPI
        run: npm run validate:api

      - name: Check generated API types
        run: npm run check:api-types

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

  # Tests that need real PostgreSQL and Redis (API readiness, Prisma, BullMQ worker).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          # Throwaway credentials for an ephemeral CI container; not a secret.
          POSTGRES_USER: sellonit
          POSTGRES_PASSWORD: sellonit_ci
          POSTGRES_DB: sellonit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sellonit -d sellonit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: public.ecr.aws/docker/library/redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sellonit:sellonit_ci@localhost:5432/sellonit_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Integration tests
        run: npm run test:integration
