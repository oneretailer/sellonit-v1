name: API Contract

on:
  pull_request:
    paths:
      - "docs/openapi.yaml"
      - "packages/shared/**"
      - "scripts/check-api-types.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api-contract.yml"
  push:
    branches: [main]
    paths:
      - "docs/openapi.yaml"
      - "packages/shared/**"
      - "scripts/check-api-types.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate OpenAPI
        run: npm run validate:api

      - name: Verify generated API types are committed
        run: npm run check:api-types
